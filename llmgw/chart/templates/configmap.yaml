apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gw.name" . }}-config
  labels: {{- include "gw.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Generated by the llmgw chart. Secrets are referenced as os.environ/..., never inlined.
    {{- $v := .Values.variants }}
    model_list:
    {{- range .Values.models }}
      - model_name: {{ . | quote }}                       # Lakera: block
        litellm_params: { model: {{ printf "openrouter/%s" . | quote }}, api_key: os.environ/OPENROUTER_API_KEY }
      {{- if $v.monitor }}
      - model_name: {{ printf "monitor/%s" . | quote }}   # Lakera: detect + log, never block
        litellm_params: { model: {{ printf "openrouter/%s" . | quote }}, api_key: os.environ/OPENROUTER_API_KEY }
      {{- end }}
      {{- if $v.unguarded }}
      - model_name: {{ printf "unguarded/%s" . | quote }} # NO guardrail (comparison demos only)
        litellm_params: { model: {{ printf "openrouter/%s" . | quote }}, api_key: os.environ/OPENROUTER_API_KEY }
      {{- end }}
    {{- end }}

    # Check Point Lakera Guard. Guardrails are not default_on: the policy engine below binds them
    # server-side to model names, so clients cannot choose or drop them (opt-outs are admin-metadata only).
    guardrails:
    {{- range $g := list (dict "n" "lakera-input" "m" "pre_call" "f" .Values.lakera.onFlagged) (dict "n" "lakera-output" "m" "post_call" "f" .Values.lakera.onFlagged) (dict "n" "lakera-monitor-input" "m" "pre_call" "f" "monitor") (dict "n" "lakera-monitor-output" "m" "post_call" "f" "monitor") }}
      - guardrail_name: {{ $g.n }}
        litellm_params:
          guardrail: lakera_v2
          mode: {{ $g.m }}
          default_on: false
          api_key: os.environ/LAKERA_API_KEY
          project_id: os.environ/LAKERA_PROJECT_ID
          api_base: {{ $.Values.lakera.apiBase | quote }}
          on_flagged: {{ $g.f }}
    {{- end }}

    policies:
      lakera-block:
        description: Lakera Guard on input and output, flagged requests are blocked (HTTP 400)
        guardrails: { add: [lakera-input, lakera-output] }
      lakera-monitor:
        description: Lakera Guard on input and output, detections logged only
        guardrails: { add: [lakera-monitor-input, lakera-monitor-output] }

    policy_attachments:
      - policy: lakera-block
        models: {{ toJson .Values.models }}
      {{- if $v.monitor }}
      - policy: lakera-monitor
        models: [{{ range $i, $m := .Values.models }}{{ if $i }}, {{ end }}{{ printf "monitor/%s" $m | quote }}{{ end }}]
      {{- end }}

    {{- $fb := .Values.fallbackModel }}
    {{- if $fb }}
    router_settings:
      num_retries: 1
      # Fallback stays within the same variant, so the guardrail mode is preserved.
      fallbacks:
      {{- range .Values.models }}{{ if ne . $fb }}
        - {{ dict . (list $fb) | toJson }}
        {{- if $v.monitor }}
        - {{ dict (printf "monitor/%s" .) (list (printf "monitor/%s" $fb)) | toJson }}
        {{- end }}
        {{- if $v.unguarded }}
        - {{ dict (printf "unguarded/%s" .) (list (printf "unguarded/%s" $fb)) | toJson }}
        {{- end }}
      {{- end }}{{ end }}
    {{- end }}

    litellm_settings:
      drop_params: true
      turn_off_message_logging: true   # never log prompts/completions
      telemetry: false

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      {{- if .Values.database.enabled }}
      database_url: os.environ/DATABASE_URL
      store_model_in_db: false
      {{- end }}

  # TLS terminator: TLS 1.2/1.3 with AES-256-GCM / ChaCha20-Poly1305 only, HSTS; LiteLLM listens on pod loopback.
  nginx.conf: |
    server {
      listen 8443 ssl;
      server_tokens off;
      ssl_certificate     /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
      ssl_prefer_server_ciphers on;
      ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
      ssl_session_tickets off;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options nosniff always;
      client_max_body_size 10m;
      # Route allowlist: only endpoints Lakera Guard covers (chat completions), model listing,
      # health and key admin. Everything else (Responses API, /v1/messages, embeddings, UI, ...)
      # is refused, so no client can route around the guardrails.
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 300s;
      location ~ ^/(v1/)?(chat/completions|models)(/[^/]*)?$ { proxy_pass http://127.0.0.1:4000; }
      location ~ ^/health/(liveliness|readiness)$ { proxy_pass http://127.0.0.1:4000; }
      location ~ ^/key/(generate|info|delete|update|list)$ { proxy_pass http://127.0.0.1:4000; }
      location / {
        default_type application/json;
        return 403 '{"error":{"message":"endpoint not allowed by llmgw (only guarded /v1/chat/completions)","code":"403"}}';
      }
    }
