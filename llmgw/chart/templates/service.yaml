# ClusterIP only: reached via `make tunnel` (kubectl port-forward over the ../vm SSH tunnel).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gw.name" . }}
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "gw.selector" . | nindent 4 }}
  ports:
    - { name: https, port: 443, targetPort: https }
