{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller may reach the web pods; no egress needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web.name" . }}
  labels: {{- include "web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "web.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - { port: 8080, protocol: TCP }
  egress: []
{{- end }}
