apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web.name" . }}-nginx
  labels: {{- include "web.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_tokens off;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /pod {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "$hostname\n";
      }

      location / {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Pod-Name $hostname always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>$hostname</title>
    <style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;background:#f6f7f9;color:#222}
    main{text-align:center}h1{font-size:2.4rem;margin:.2em 0}code{background:#e8eaee;padding:.15em .4em;border-radius:4px}</style></head>
    <body><main><p>Served by pod</p><h1 id="pod">$hostname</h1>
    <p>pod IP <code>$server_addr</code> &middot; {{ .Release.Namespace }}/{{ include "web.name" . }} &middot; reload to hit another replica</p></main></body></html>\n';
      }
    }
