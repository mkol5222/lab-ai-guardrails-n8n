# Name used in the URL / certificate. *.localhost resolves to 127.0.0.1 in browsers and curl.
host: n8n.localhost
# Local port of `make tunnel` (kubectl port-forward); part of the public URL n8n renders.
localPort: 8443

image:
  repository: n8nio/n8n
  tag: "2.48.7"
  pullPolicy: IfNotPresent

timezone: Europe/Prague

persistence:
  size: 5Gi
  storageClass: ""          # "" = cluster default (microk8s-hostpath)

tls:
  caCommonName: n8n-private local CA
  caDuration: 87600h        # 10 years
  duration: 8760h           # 1 year; n8n reads the cert at start, `make up` restarts it after renewal
  renewBefore: 720h

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

# Trust an extra CA (e.g. the in-cluster llmgw gateway's private CA) without disabling TLS
# verification: ConfigMap with key ca.crt in this namespace (`make llm-connect` creates "llmgw-ca").
extraCA:
  configMap: ""

# Pre-provisioned instance owner account (n8n >= 2.17 env-managed owner).
# Password and bcrypt hash are generated in-cluster on first install (Secret <release>-owner,
# reused on upgrade, kept on uninstall). Retrieve with `make -C n8n passwd` or `make n8n-passwd`.
owner:
  enabled: true
  email: guru@example.com
  firstName: Guru
  lastName: Lab

# Instance-level MCP server (/mcp-server/http), managed via environment variables.
# Sets N8N_MCP_MANAGED_BY_ENV=true and N8N_MCP_ACCESS_ENABLED=true on startup.
mcp:
  enabled: true

# nginx sidecar in front of n8n for forwarding proxies that rewrite the browser's Origin header.
# GitHub Codespaces forwards https://<codespace>-<port>.app.github.dev with X-Forwarded-Host set to that name
# but Origin rewritten to https://localhost:<port>, so n8n's push/websocket origin check always fails
# (chat and live editor updates break). The sidecar terminates TLS with the same certificate, pins
# X-Forwarded-Host to `host` and maps ONLY the listed origins to the canonical origin; any other Origin
# passes through unchanged, so n8n still rejects cross-site requests. Upstream TLS to n8n is verified.
originProxy:
  enabled: false
  allowedOrigins: []          # e.g. ["https://localhost:8443"] (set by `make up` in Codespaces)
  image: nginxinc/nginx-unprivileged:1.31.7-alpine

# Extra n8n environment variables (https://docs.n8n.io/hosting/configuration/environment-variables/)
extraEnv: {}
