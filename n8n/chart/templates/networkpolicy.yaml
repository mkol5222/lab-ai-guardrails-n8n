# Deny all inbound pod traffic from other pods/namespaces. kubectl port-forward and kubelet
# probes enter via the node and are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "n8n.name" . }}
  labels: {{- include "n8n.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "n8n.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
