{{- /*
N8N_ENCRYPTION_KEY encrypts every credential stored in n8n. It is generated in-cluster on first
install, reused on upgrade (lookup), and kept on uninstall (resource-policy: keep): losing it makes
stored credentials unreadable. It never appears in values, files or git.
*/ -}}
{{- $name := printf "%s-encryption-key" (include "n8n.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "n8n.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "N8N_ENCRYPTION_KEY") }}
  N8N_ENCRYPTION_KEY: {{ index $existing.data "N8N_ENCRYPTION_KEY" }}
  {{- else }}
  N8N_ENCRYPTION_KEY: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
