{{- /*
Pre-provisioned n8n instance owner credentials (n8n >= 2.17 env-managed owner).
Generated in-cluster on first install, reused on upgrade (lookup), and kept on uninstall
(resource-policy: keep). The pod only reads password_hash (N8N_INSTANCE_OWNER_PASSWORD_HASH),
never the plaintext password; retrieve the password with `make -C n8n passwd` or `make n8n-passwd`.
*/ -}}
{{- if .Values.owner.enabled -}}
{{- $name := printf "%s-owner" (include "n8n.name" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict -}}
{{- $data := $existing.data | default dict -}}
{{- $pw := "" -}}
{{- $hash := "" -}}
{{- if and (hasKey $data "password") (hasKey $data "password_hash") -}}
  {{- $pw = get $data "password" -}}
  {{- $hash = get $data "password_hash" -}}
{{- else -}}
  {{- $plain := randAlphaNum 24 -}}
  {{- $pw = $plain | b64enc -}}
  {{- $hash = htpasswd "u" $plain | trimPrefix "u:" | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "n8n.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  email: {{ .Values.owner.email | b64enc }}
  password: {{ $pw }}
  password_hash: {{ $hash }}
{{- end }}
