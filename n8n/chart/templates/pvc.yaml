apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "n8n.name" . }}-data
  labels: {{- include "n8n.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # workflows/credentials survive `make down` (PURGE=1 deletes)
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
