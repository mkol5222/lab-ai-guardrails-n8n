{{- if .Values.originProxy.enabled }}
{{- $name := include "n8n.name" . -}}
{{- $origin := include "n8n.url" . | trimSuffix "/" -}}
{{- $fwdHost := trimPrefix "https://" $origin -}}
# nginx config for the origin-proxy sidecar (see values.yaml originProxy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-origin-proxy
  labels: {{- include "n8n.labels" . | nindent 4 }}
data:
  nginx.conf: |
    # Only the allowlisted origins are mapped to the canonical origin; everything else is passed
    # through unchanged and rejected by n8n's own origin check.
    map $http_origin $n8n_origin {
      default $http_origin;
      {{- range .Values.originProxy.allowedOrigins }}
      {{ . | quote }} {{ $origin | quote }};
      {{- end }}
    }
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
    server {
      listen 8443 ssl;
      server_tokens off;
      ssl_certificate     /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
      ssl_prefer_server_ciphers on;
      ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
      ssl_session_tickets off;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      client_max_body_size 16m;
      location / {
        # n8n keeps terminating its own TLS on loopback; verify it with the private CA.
        proxy_pass https://127.0.0.1:5678;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /tls/ca.crt;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $n8n_origin;
        proxy_set_header X-Forwarded-Host {{ $fwdHost | quote }};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
    }
{{- end }}
