{{- $name := include "n8n.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "n8n.labels" . | nindent 4 }}
spec:
  replicas: 1                 # SQLite on a RWO volume: single instance
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "n8n.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "n8n.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: n8n
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: https, containerPort: 5678 }
          envFrom:
            - secretRef: { name: {{ $name }}-encryption-key }
          env:
            # n8n terminates TLS itself (no ingress, nothing exposed outside the cluster).
            - { name: N8N_PROTOCOL, value: https }
            - { name: N8N_SSL_CERT, value: /tls/tls.crt }
            - { name: N8N_SSL_KEY, value: /tls/tls.key }
            - { name: N8N_HOST, value: {{ .Values.host | quote }} }
            - { name: N8N_PORT, value: "5678" }
            - { name: N8N_EDITOR_BASE_URL, value: {{ include "n8n.url" . | quote }} }
            - { name: WEBHOOK_URL, value: {{ include "n8n.url" . | quote }} }
            - { name: N8N_SECURE_COOKIE, value: "true" }
            - { name: GENERIC_TIMEZONE, value: {{ .Values.timezone | quote }} }
            - { name: TZ, value: {{ .Values.timezone | quote }} }
            - { name: DB_TYPE, value: sqlite }
            - { name: DB_SQLITE_POOL_SIZE, value: "2" }
            - { name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS, value: "true" }
            - { name: N8N_RUNNERS_ENABLED, value: "true" }
            - { name: N8N_BLOCK_ENV_ACCESS_IN_NODE, value: "true" }
            # Keep data in-house: no telemetry, no third-party community packages, no built-in AI assistant.
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }
            - { name: N8N_VERSION_NOTIFICATIONS_ENABLED, value: "false" }
            - { name: N8N_PERSONALIZATION_ENABLED, value: "false" }
            - { name: N8N_COMMUNITY_PACKAGES_ENABLED, value: "false" }
            - { name: N8N_AI_ENABLED, value: "false" }
            {{- if .Values.extraCA.configMap }}
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/extra-ca/ca.crt }
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz/readiness, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /home/node/.n8n }
            - { name: tls, mountPath: /tls, readOnly: true }
            {{- if .Values.extraCA.configMap }}
            - { name: extra-ca, mountPath: /etc/extra-ca, readOnly: true }
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $name }}-data }
        - name: tls
          secret: { secretName: {{ $name }}-tls }
        {{- if .Values.extraCA.configMap }}
        - name: extra-ca
          configMap: { name: {{ .Values.extraCA.configMap }} }
        {{- end }}
